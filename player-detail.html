<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Golf Tracker — Player Stats</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2D4A3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div>
    <span class="eyebrow">Golf Tracker</span>
    <h1 id="pageTitle">Player Stats</h1>
  </div>
</div>

<div class="page" id="app">
  <p class="empty-state">Loading…</p>
</div>

<script src="db.js"></script>
<script src="stats.js"></script>
<script src="nav.js"></script>
<script>
const app = document.getElementById('app');
const pageTitle = document.getElementById('pageTitle');
const params = new URLSearchParams(window.location.search);
const playerId = Number(params.get('id'));

function fmtToPar(n) {
  if (n == null) return '–';
  return (n > 0 ? '+' : '') + n.toFixed(1);
}

async function load() {
  const player = await GolfDB.get('players', playerId);
  if (!player) {
    app.innerHTML = `<div class="card"><p class="empty-state">Player not found.</p></div>
      <a href="players.html" class="btn secondary">Back to Players</a>`;
    return;
  }

  pageTitle.textContent = player.name;
  const { overall, byCourse } = await computePlayerStats(playerId);

  if (overall.roundsPlayed === 0) {
    app.innerHTML = `
      <div class="card">
        <h2>${escapeHtml(player.name)}</h2>
        <p class="empty-state">No completed rounds yet for this player.</p>
      </div>
      <a href="players.html" class="btn secondary">Back to Players</a>
    `;
    return;
  }

  app.innerHTML = `
    <div class="card">
      <h2>Overall</h2>
      <table class="score-table">
        <tr><td>Rounds played</td><td class="tabular">${overall.roundsPlayed}</td></tr>
        <tr><td>Wins</td><td class="tabular">${overall.wins}</td></tr>
        <tr><td>Avg score to par</td><td class="tabular">${fmtToPar(overall.avgToPar)}</td></tr>
        <tr><td>Total penalty strokes</td><td class="tabular">${overall.totalPenalties}</td></tr>
        <tr><td>Avg putts per hole</td><td class="tabular">${overall.avgPuttsPerHole == null ? '–' : overall.avgPuttsPerHole.toFixed(1)}</td></tr>
        <tr><td>Best round</td><td class="tabular">${overall.best ? `${overall.best.total} (${fmtToPar(overall.best.toPar)})` : '–'}</td></tr>
        <tr><td>Worst round</td><td class="tabular">${overall.worst ? `${overall.worst.total} (${fmtToPar(overall.worst.toPar)})` : '–'}</td></tr>
      </table>
      ${overall.best ? `<p class="subtitle-note">Best: ${escapeHtml(overall.best.courseName)} · ${fmtDate(overall.best.date)}</p>` : ''}
      ${overall.worst ? `<p class="subtitle-note">Worst: ${escapeHtml(overall.worst.courseName)} · ${fmtDate(overall.worst.date)}</p>` : ''}
    </div>

    <div class="card">
      <h2>By course</h2>
      ${byCourse.length === 0 ? '<p class="empty-state">No course data yet.</p>' : `
        <table class="score-table">
          <tr><th>Course</th><th>Rounds</th><th>Avg ±Par</th></tr>
          ${byCourse.map(c => `
            <tr class="clickable-row" data-course-id="${c.id}">
              <td>${escapeHtml(c.name)} ›</td>
              <td class="tabular">${c.roundsPlayed}</td>
              <td class="tabular">${fmtToPar(c.avgToPar)}</td>
            </tr>`).join('')}
        </table>
        <p class="subtitle-note" style="margin-top:10px;">Tap a course to see this player's per-hole breakdown.</p>
      `}
    </div>

    <div id="courseHoleBreakdown"></div>

    <a href="players.html" class="btn secondary">Back to Players</a>
  `;

  document.querySelectorAll('#app .clickable-row').forEach(row => {
    row.addEventListener('click', () => showPlayerCourseBreakdown(Number(row.dataset.courseId)));
  });
}

async function showPlayerCourseBreakdown(courseId) {
  const container = document.getElementById('courseHoleBreakdown');
  container.innerHTML = `<div class="card"><p class="empty-state">Loading…</p></div>`;
  container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const data = await computePlayerCourseHoleStats(playerId, courseId);
  if (!data) {
    container.innerHTML = `<div class="card"><p class="empty-state">Could not load hole data.</p></div>`;
    return;
  }

  container.innerHTML = `
    <div class="card">
      <h2>${escapeHtml(data.course.name)} — per hole</h2>
      <table class="score-table">
        <tr><th>Hole</th><th>Par</th><th>Low</th><th>High</th><th>Avg ±Par</th><th>Avg Pen</th><th>Avg Putts</th></tr>
        ${data.rows.map(r => `
          <tr>
            <td>${r.number}</td>
            <td class="tabular">${r.par}</td>
            <td class="tabular">${r.lowest ?? '–'}</td>
            <td class="tabular">${r.highest ?? '–'}</td>
            <td class="tabular">${r.avgToPar == null ? '–' : fmtToPar(r.avgToPar)}</td>
            <td class="tabular">${r.avgPenalties == null ? '–' : r.avgPenalties.toFixed(1)}</td>
            <td class="tabular">${r.avgPutts == null ? '–' : r.avgPutts.toFixed(1)}</td>
          </tr>`).join('')}
      </table>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderTabbar('players.html');

if (!playerId || Number.isNaN(playerId)) {
  app.innerHTML = `
    <div class="card">
      <p class="empty-state">No player specified.</p>
    </div>
    <a href="players.html" class="btn secondary">Back to Players</a>`;
} else {
  load().catch(err => {
    app.innerHTML = `
      <div class="card">
        <h2>Something went wrong</h2>
        <p style="font-family:-apple-system,sans-serif;font-size:13px;color:var(--bogey-red);word-break:break-word;">${escapeHtml(err.message || String(err))}</p>
      </div>
      <a href="players.html" class="btn secondary">Back to Players</a>`;
    console.error(err);
  });
}
</script>
</body>
</html>
