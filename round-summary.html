<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Golf Tracker — Round Summary</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2D4A3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div>
    <span class="eyebrow">Golf Tracker</span>
    <h1 id="pageTitle">Round Summary</h1>
  </div>
</div>

<div class="page" id="app">
  <p class="empty-state">Loading…</p>
</div>

<script src="db.js"></script>
<script src="stats.js"></script>
<script src="nav.js"></script>
<script>
const app = document.getElementById('app');
const pageTitle = document.getElementById('pageTitle');
const params = new URLSearchParams(window.location.search);
const roundId = Number(params.get('id'));

function fmtToPar(n) {
  if (n == null) return '–';
  return (n > 0 ? '+' : '') + n;
}

function summaryTable(title, rows, players, coursePar, showPar) {
  return `
    <div class="card">
      <h2>${title}</h2>
      <table class="score-table">
        <tr>
          <th>Player</th>
          <th>Strokes</th>
          <th>Pen</th>
          <th>Putts</th>
          <th>Total</th>
          ${showPar ? '<th>±Par</th>' : ''}
        </tr>
        ${rows.map(r => {
          const p = players.find(pl => pl.id === r.pid);
          return `
            <tr>
              <td>${escapeHtml(p ? p.name : '—')}</td>
              <td class="tabular">${r.strokes}</td>
              <td class="tabular">${r.penalties}</td>
              <td class="tabular">${r.putts}</td>
              <td class="tabular" style="font-weight:700;">${r.total}</td>
              ${showPar ? `<td class="tabular">${r.holesPlayed > 0 ? fmtToPar(r.toPar) : '–'}</td>` : ''}
            </tr>`;
        }).join('')}
      </table>
      ${showPar ? `<p class="subtitle-note">Par for this section: ${coursePar}</p>` : ''}
    </div>
  `;
}

async function load() {
  const round = await GolfDB.get('rounds', roundId);
  if (!round) {
    app.innerHTML = `<div class="card"><p class="empty-state">Round not found.</p></div>
      <a href="index.html" class="btn secondary">Back to Play</a>`;
    return;
  }

  const [course, allPlayers, scores] = await Promise.all([
    GolfDB.get('courses', round.courseId),
    GolfDB.getAll('players'),
    GolfDB.getScoresForRound(round.id)
  ]);

  if (!course) {
    app.innerHTML = `<div class="card"><p class="empty-state">This round's course could no longer be found.</p></div>
      <a href="index.html" class="btn secondary">Back to Play</a>`;
    return;
  }

  pageTitle.textContent = 'Round Summary';
  const players = allPlayers.filter(p => round.playerIds.includes(p.id));
  const summary = computeRoundSummary(round, course, scores);

  const frontPar = course.holes.slice(0, 9).reduce((s, h) => s + h.par, 0);
  const backPar = course.holes.slice(9).reduce((s, h) => s + h.par, 0);

  app.innerHTML = `
    <div class="card">
      <h2>${escapeHtml(course.name)}</h2>
      <p class="subtitle-note">${fmtDate(round.date)} · ${players.length} player${players.length !== 1 ? 's' : ''} · par ${summary.coursePar}</p>
    </div>

    ${summaryTable('Front 9', summary.rows.map(r => ({ pid: r.pid, ...r.front })), players, frontPar, true)}
    ${summary.hasBack ? summaryTable('Back 9', summary.rows.map(r => ({ pid: r.pid, ...r.back })), players, backPar, true) : ''}
    ${summaryTable('Grand Total', summary.rows.map(r => ({ pid: r.pid, ...r.all })), players, summary.coursePar, true)}

    <a href="index.html" class="btn secondary">Back to Play</a>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderTabbar('index.html');

if (!roundId || Number.isNaN(roundId)) {
  app.innerHTML = `<div class="card"><p class="empty-state">No round specified.</p></div>
    <a href="index.html" class="btn secondary">Back to Play</a>`;
} else {
  load().catch(err => {
    app.innerHTML = `
      <div class="card">
        <h2>Something went wrong</h2>
        <p style="font-family:-apple-system,sans-serif;font-size:13px;color:var(--bogey-red);word-break:break-word;">${escapeHtml(err.message || String(err))}</p>
      </div>
      <a href="index.html" class="btn secondary">Back to Play</a>`;
    console.error(err);
  });
}
</script>
</body>
</html>
