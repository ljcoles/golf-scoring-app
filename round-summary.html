<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Golf Tracker — Round Summary</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2D4A3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div>
    <span class="eyebrow">Golf Tracker</span>
    <h1 id="pageTitle">Round Summary</h1>
  </div>
</div>

<div class="page" id="app">
  <p class="empty-state">Loading…</p>
</div>

<script src="db.js"></script>
<script src="stats.js"></script>
<script src="nav.js"></script>
<script>
const app = document.getElementById('app');
const pageTitle = document.getElementById('pageTitle');
const params = new URLSearchParams(window.location.search);
const roundId = Number(params.get('id'));

let viewState = null;

function fmtToPar(n) {
  if (n == null) return '–';
  return (n > 0 ? '+' : '') + n;
}

async function load() {
  const round = await GolfDB.get('rounds', roundId);
  if (!round) {
    app.innerHTML = `<div class="card"><p class="empty-state">Round not found.</p></div>
      <a href="index.html" class="btn secondary">Back to Play</a>`;
    return;
  }

  const [course, allPlayers, scores] = await Promise.all([
    GolfDB.get('courses', round.courseId),
    GolfDB.getAll('players'),
    GolfDB.getScoresForRound(round.id)
  ]);

  if (!course) {
    app.innerHTML = `<div class="card"><p class="empty-state">This round's course could no longer be found.</p></div>
      <a href="index.html" class="btn secondary">Back to Play</a>`;
    return;
  }

  pageTitle.textContent = course.name;
  const players = allPlayers.filter(p => round.playerIds.includes(p.id));
  const holeGrid = computeHoleGrid(round, course, scores);
  const summary = computeRoundSummary(round, course, scores);

  viewState = { round, course, players, holeGrid, summary, activeTab: 'front' };
  render();
}

function render() {
  const { players, activeTab } = viewState;
  const hasBack = viewState.summary.hasBack;

  app.innerHTML = `
    <div class="card">
      <p class="subtitle-note">${fmtDate(viewState.round.date)} · ${players.length} player${players.length !== 1 ? 's' : ''} · par ${viewState.summary.coursePar}</p>
    </div>

    <div class="tab-switch">
      <button class="tab-btn ${activeTab === 'front' ? 'active' : ''}" data-tab="front">Front 9</button>
      ${hasBack ? `<button class="tab-btn ${activeTab === 'back' ? 'active' : ''}" data-tab="back">Back 9</button>` : ''}
      <button class="tab-btn ${activeTab === 'totals' ? 'active' : ''}" data-tab="totals">Totals</button>
    </div>

    <div id="tabContent"></div>

    <a href="index.html" class="btn secondary">Back to Play</a>
  `;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      viewState.activeTab = btn.dataset.tab;
      render();
    });
  });

  drawTabContent();
}

function drawTabContent() {
  const { players, holeGrid, summary, activeTab } = viewState;
  const container = document.getElementById('tabContent');

  if (activeTab === 'totals') {
    container.innerHTML = totalsTable();
    return;
  }

  const holes = activeTab === 'front' ? holeGrid.slice(0, 9) : holeGrid.slice(9);
  const rowsForTotal = activeTab === 'front'
    ? summary.rows.map(r => ({ pid: r.pid, ...r.front }))
    : summary.rows.map(r => ({ pid: r.pid, ...r.back }));
  const label = activeTab === 'front' ? 'OUT' : 'IN';

  container.innerHTML = `
    <div class="card scorecard-narrow-card">
      <table class="score-table scorecard-narrow-table">
        <tr>
          <th>Hole</th><th>Player</th><th>Strokes</th><th>Pen</th><th>Putts</th><th>Total</th><th>±Par</th>
        </tr>
        ${holes.map(h => players.map((p, i) => {
          const entry = h.scores.find(s => s.pid === p.id);
          const strokes = entry ? entry.strokes : null;
          const penalties = entry ? entry.penalties : null;
          const putts = entry ? entry.putts : null;
          const played = strokes != null;
          const total = played ? strokes + (penalties || 0) + (putts || 0) : null;
          const toPar = played ? total - h.par : null;
          return `
            <tr class="${i === 0 ? 'hole-group-start' : ''}">
              <td class="hole-col">${i === 0 ? `${h.number}<span class="hole-par-sub">Par ${h.par}</span>` : ''}</td>
              <td>${escapeHtml(p.name)}</td>
              <td class="tabular">${played ? strokes : '–'}</td>
              <td class="tabular">${played ? penalties : '–'}</td>
              <td class="tabular">${played ? putts : '–'}</td>
              <td class="tabular" style="font-weight:700;">${played ? total : '–'}</td>
              <td class="tabular">${played ? fmtToPar(toPar) : '–'}</td>
            </tr>`;
        }).join('')).join('')}
      </table>
    </div>

    <div class="card">
      <h2>${label === 'OUT' ? 'Front 9' : 'Back 9'} Totals</h2>
      <table class="score-table">
        <tr><th>Player</th><th>Strokes</th><th>Pen</th><th>Putts</th><th>Total</th><th>±Par</th></tr>
        ${rowsForTotal.map(r => {
          const p = players.find(pl => pl.id === r.pid);
          const played = r.holesPlayed > 0;
          return `
            <tr>
              <td>${escapeHtml(p ? p.name : '—')}</td>
              <td class="tabular">${r.strokes}</td>
              <td class="tabular">${r.penalties}</td>
              <td class="tabular">${r.putts}</td>
              <td class="tabular" style="font-weight:700;">${played ? r.total : '–'}</td>
              <td class="tabular">${played ? fmtToPar(r.toPar) : '–'}</td>
            </tr>`;
        }).join('')}
      </table>
      <p class="subtitle-note">${label === 'OUT' ? 'Front 9' : 'Back 9'} par: ${holes.reduce((s, h) => s + h.par, 0)}</p>
    </div>
  `;
}

function totalsTable() {
  const { players, summary } = viewState;
  const sorted = [...summary.rows].sort((a, b) => {
    if (a.all.holesPlayed === 0) return 1;
    if (b.all.holesPlayed === 0) return -1;
    return a.all.total - b.all.total;
  });

  return `
    <div class="card">
      <h2>Grand Total</h2>
      <table class="score-table">
        <tr><th>Player</th><th>Strokes</th><th>Pen</th><th>Putts</th><th>Total</th><th>±Par</th></tr>
        ${sorted.map((r, i) => {
          const p = players.find(pl => pl.id === r.pid);
          return `
            <tr>
              <td class="${i === 0 && r.all.holesPlayed > 0 ? 'rank-1' : ''}">${escapeHtml(p ? p.name : '—')}</td>
              <td class="tabular">${r.all.strokes}</td>
              <td class="tabular">${r.all.penalties}</td>
              <td class="tabular">${r.all.putts}</td>
              <td class="tabular" style="font-weight:700;">${r.all.holesPlayed > 0 ? r.all.total : '–'}</td>
              <td class="tabular">${r.all.holesPlayed > 0 ? fmtToPar(r.all.toPar) : '–'}</td>
            </tr>`;
        }).join('')}
      </table>
      <p class="subtitle-note">Course par: ${summary.coursePar}</p>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderTabbar('index.html');

if (!roundId || Number.isNaN(roundId)) {
  app.innerHTML = `<div class="card"><p class="empty-state">No round specified.</p></div>
    <a href="index.html" class="btn secondary">Back to Play</a>`;
} else {
  load().catch(err => {
    app.innerHTML = `
      <div class="card">
        <h2>Something went wrong</h2>
        <p style="font-family:-apple-system,sans-serif;font-size:13px;color:var(--bogey-red);word-break:break-word;">${escapeHtml(err.message || String(err))}</p>
      </div>
      <a href="index.html" class="btn secondary">Back to Play</a>`;
    console.error(err);
  });
}
</script>
</body>
</html>
