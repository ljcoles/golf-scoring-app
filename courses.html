<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Golf Tracker — Courses</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2D4A3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div>
    <span class="eyebrow">Golf Tracker</span>
    <h1 id="pageTitle">Courses</h1>
  </div>
</div>

<div class="page" id="app"></div>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
const app = document.getElementById('app');
const pageTitle = document.getElementById('pageTitle');

async function renderList() {
  pageTitle.textContent = 'Courses';
  const courses = await GolfDB.getAll('courses');

  app.innerHTML = `
    <div class="card">
      <h2>Your courses</h2>
      <div id="courseList">
        ${courses.length === 0
          ? '<p class="empty-state">No courses yet. Add one below.</p>'
          : courses.map(c => `
            <div class="list-item course-row" data-id="${c.id}">
              <a href="#" class="edit-course" data-id="${c.id}" style="flex:1;min-width:0;text-decoration:none;color:var(--ink);">
                <div class="title">${escapeHtml(c.name)}</div>
                <div class="subtitle">${c.holes.length} holes · par ${c.holes.reduce((s,h)=>s+h.par,0)}</div>
              </a>
              <a href="course-stats.html?id=${c.id}" class="pill" style="text-decoration:none;">Stats ›</a>
            </div>`).join('')}
      </div>
    </div>
    <button class="btn brass" id="newCourseBtn">+ Add course</button>
  `;

  document.getElementById('newCourseBtn').addEventListener('click', () => renderEditor(null));
  document.querySelectorAll('.edit-course').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.preventDefault();
      const course = await GolfDB.get('courses', Number(el.dataset.id));
      renderEditor(course);
    });
  });
}

function defaultHoles(count, defaultPar = 4) {
  return Array.from({ length: count }, (_, i) => ({ number: i + 1, par: defaultPar }));
}

function renderEditor(course) {
  pageTitle.textContent = course ? 'Edit Course' : 'New Course';
  const isNew = !course;
  const holeCount = course ? course.holes.length : 18;
  const name = course ? course.name : '';
  const holes = course ? course.holes : defaultHoles(18);

  app.innerHTML = `
    <div class="card">
      <h2>${isNew ? 'New course' : 'Edit course'}</h2>
      <label for="courseName">Course name</label>
      <input type="text" id="courseName" value="${escapeHtml(name)}" placeholder="e.g. Churston Golf Club">

      <label for="holeCount">Number of holes</label>
      <select id="holeCount">
        <option value="9" ${holeCount === 9 ? 'selected' : ''}>9</option>
        <option value="18" ${holeCount === 18 ? 'selected' : ''}>18</option>
      </select>

      <div class="section-divider">Par per hole</div>
      <div id="parGrid" class="par-input-grid"></div>

      <button class="btn" id="saveCourseBtn">Save course</button>
      ${!isNew ? '<button class="btn danger" id="deleteCourseBtn">Delete course</button>' : ''}
      <button class="btn secondary" id="cancelBtn">Cancel</button>
    </div>
  `;

  function drawParGrid(count) {
    const grid = document.getElementById('parGrid');
    const current = holes.slice(0, count);
    while (current.length < count) current.push({ number: current.length + 1, par: 4 });
    grid.innerHTML = current.map(h => `
      <div class="hole-label">Hole ${h.number}</div>
      <select data-hole="${h.number}" class="par-select">
        ${[3,4,5,6].map(p => `<option value="${p}" ${p === h.par ? 'selected' : ''}>Par ${p}</option>`).join('')}
      </select>
    `).join('');
  }

  drawParGrid(holeCount);

  document.getElementById('holeCount').addEventListener('change', (e) => {
    drawParGrid(Number(e.target.value));
  });

  document.getElementById('cancelBtn').addEventListener('click', renderList);

  document.getElementById('saveCourseBtn').addEventListener('click', async () => {
    const nameVal = document.getElementById('courseName').value.trim();
    if (!nameVal) { showToast('Enter a course name'); return; }
    const parSelects = document.querySelectorAll('.par-select');
    const newHoles = Array.from(parSelects).map(sel => ({
      number: Number(sel.dataset.hole),
      par: Number(sel.value)
    }));

    if (isNew) {
      await GolfDB.createCourse({ name: nameVal, holes: newHoles });
      showToast('Course added');
    } else {
      await GolfDB.updateCourse({ id: course.id, name: nameVal, holes: newHoles });
      showToast('Course updated');
    }
    renderList();
  });

  document.getElementById('deleteCourseBtn')?.addEventListener('click', async () => {
    if (confirm(`Delete ${course.name}? Rounds played here will keep their scores but lose the course link.`)) {
      await GolfDB.remove('courses', course.id);
      renderList();
    }
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderTabbar('courses.html');
renderList();
</script>
</body>
</html>
